secret_policy:
  never_print_values: true
  tracked_files_must_not_contain_secrets: true
  use_environment_or_ignored_slots: true
  masked_scan_output: file_line_only

allowed_local_secret_slots:
  - ".env.*.local"
  - ".mcp.local/*.json"
  - "~/SIRINXDev/.ghostclaw_runtime/secrets/"

blocked_reads:
  - "~/.ssh"
  - "~/Library/Application Support/Google/Chrome"
  - "~/Library/Keychains"
  - "*.pem"
  - "*.key"

on_secret_detected:
  decision: auto_quarantine_and_log_path_only
  print_value: false
