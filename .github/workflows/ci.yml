# CI for the SIRINX monorepo.
#
# P0 (2026-10-10): give apps/public-web its own CI job (it previously had none,
# so the Three.js frontend was never built or tested by CI) and unblock the two
# failing jobs on 6002430:
#   - node-governance: root `npm run check` chains into command-center:check,
#     which requires CC devDependencies; install them first. verify-next-phase
#     now allowlists the committed defensive secret-scan.yml.
#   - command-center-site: rendered-HTML guard regex no longer matches minified
#     runtime script bodies (vinext beta streams inline scripts like b<a.length).
# Actions are pinned by full SHA (mutable-tag supply-chain hardening).
# Root is a pnpm workspace; pnpm version comes from root packageManager pin.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  node-governance:
    name: Node governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install root dev dependencies
        run: npm ci
      - name: Install Command Center dependencies (needed by root check chain)
        working-directory: sites/ghostclaw-hermes-v3-command-center
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repo governance scripts
        run: npm run check
      - name: Hermes control API tests
        # control:test excludes the swarm-contract suite: it validates the
        # operator machine's .hermes/state.json, which never exists in CI.
        run: npm run control:test

  command-center-site:
    name: Private Command Center source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/ghostclaw-hermes-v3-command-center
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: sites/ghostclaw-hermes-v3-command-center/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build deployable output
        run: npm run build
      - name: Verify rendering, auth, and leak boundaries
        run: npm test
      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

  public-web:
    name: Public web (Vite + React + Three.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # pnpm version is read from the root packageManager field (10.4.1)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          verify-deps-before-run: 'false'
      - name: Typecheck
        run: pnpm --config.verify-deps-before-run=false --dir apps/public-web check
      # Build must precede Unit tests: crawlReachability.test.ts reads the
      # prerendered dist/public/ tree (77 province pages) as its fixture.
      - name: Build
        run: pnpm --config.verify-deps-before-run=false --dir apps/public-web build
      - name: Unit tests
        run: pnpm --config.verify-deps-before-run=false --dir apps/public-web test
      - name: Upload build output for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-web-dist
          path: apps/public-web/dist/
          retention-days: 7
