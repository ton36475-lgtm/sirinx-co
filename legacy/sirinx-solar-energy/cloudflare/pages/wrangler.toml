# SIRINX Solar Energy — Cloudflare Pages
# Deploy Next.js static export to Cloudflare Pages
#
# Deploy command:
#   wrangler pages deploy sirinx-app/out --project-name sirinx-solar-pages
#
# Or via GitHub CI: connect repo in Cloudflare Pages dashboard

name = "sirinx-solar-pages"
pages_build_output_dir = "../../sirinx-app/out"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Build settings (used when deploying via Cloudflare Pages CI)
# Set these in the Cloudflare Pages dashboard under Settings > Builds
# Build command: cd sirinx-app && npm run build
# Build output: sirinx-app/out
# Root directory: / (repo root)
# Node.js version: 20.x

# Production environment variables
# Set secrets in dashboard: Settings > Environment variables
[vars]
NEXT_PUBLIC_SITE_URL = "https://sirinx.com"
NODE_ENV = "production"

# Preview deployments (PRs)
[env.preview]
vars = { NODE_ENV = "preview" }

# KV namespace for edge caching (optional, for Pages Functions)
# [[kv_namespaces]]
# binding = "PAGES_CACHE"
# id = "<KV_NAMESPACE_ID>"
