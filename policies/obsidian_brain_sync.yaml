version: ghostclaw-obsidian-brain-sync-v1
mode:
  name: local_first_brain_sync
  enabled: true
  provider_calls_required: false
  cloud_sync_required: false
paths:
  vault_root: /Users/sirinx/Documents/Obsidian Vault/SIRINX
  digest_note: /Users/sirinx/Documents/Obsidian Vault/SIRINX/AI HQ Knowledge Digest.md
  operations_dir: /Users/sirinx/Documents/Obsidian Vault/SIRINX/06_OPERATIONS
  ai_memory_dir: /Users/sirinx/Documents/Obsidian Vault/SIRINX/08_AI_MEMORY
  automations_dir: /Users/sirinx/Documents/Obsidian Vault/SIRINX/09_AUTOMATIONS
  runtime_jsonl: /Users/sirinx/SIRINXDev/.ghostclaw_runtime/a2async/memory/obsidian_sync.jsonl
workers:
  kob:
    role: planner_router_context_compressor_memory_summarizer
    config_pointer: /Users/sirinx/.kob-cli/obsidian-brain-sync.json
    may_write_digest: false
    may_propose_digest_entry: true
    may_read_secret_files: false
  codex:
    role: local_repo_executor_and_memory_writer
    config_pointer: /Users/sirinx/.codex/obsidian-brain-sync.json
    may_write_digest: true
    may_propose_digest_entry: true
    may_read_secret_files: false
write_policy:
  digest_append: true
  max_entry_lines: 12
  include_source_paths: true
  include_runtime_paths: true
  include_raw_logs: false
  include_secrets: false
  mutate_frontmatter: false
  rewrite_existing_notes: false
blocked_patterns:
  - private_key
  - api_key_value
  - bearer_token
  - browser_cookie
  - password
  - otp
  - env_line_value
required_fields:
  - title
  - summary
  - source
  - next_action
