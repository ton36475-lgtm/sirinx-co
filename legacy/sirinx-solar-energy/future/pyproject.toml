[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "future-agentic-os"
version = "0.1.0"
description = "Self-Service Agentic Operating System — ระบบปฏิบัติการ AI เชิง Agentic แบบ Self-Service"
authors = [
    { name = "SIRINX Solar Energy", email = "dev@sirinx.ai" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "agentic", "fastapi", "solar", "sirinx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    "greenlet==3.0.3",
    "httpx==0.27.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "anthropic==0.25.1",
    "openai==1.25.0",
    "google-generativeai==0.5.4",
    "python-dotenv==1.0.1",
    "rich==13.7.1",
    "typer==0.12.3",
    "croniter==2.0.5",
    "apscheduler==3.10.4",
    "redis==5.0.4",
    "tenacity==8.3.0",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
future = "future.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["future*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires database)",
    "e2e: End-to-end tests (requires full stack)",
    "slow: Slow tests (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "packages"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",   # Use of assert (allowed in tests)
    "S105",   # Hardcoded password (false positives in examples)
    "S106",
    "B008",   # Do not perform function calls in default arguments (FastAPI pattern)
    "N805",   # First argument of a method should be named `self`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "T20"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["future", "packages"]
force-single-line = false

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = [".", "packages"]
omit = [
    "tests/*",
    "**/__init__.py",
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
