apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-claw-os
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ghostclaw.studio
    - api.ghostclaw.studio
    secretName: ghost-claw-os-tls
  rules:
  - host: ghostclaw.studio
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ghost-claw-os
            port:
              number: 80
  - host: api.ghostclaw.studio
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ghost-claw-os-api
            port:
              number: 8000
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ghost-claw-os-cert
  namespace: default
spec:
  secretName: ghost-claw-os-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - ghostclaw.studio
  - api.ghostclaw.studio
  - "*.ghostclaw.studio"
