name: repo_cartographer
display_name: "Repo Cartographer"
lane: A
model: codex_local
description: |
  สำรวจ repository และสร้าง map ของไฟล์ที่เกี่ยวข้อง, dependencies และ impact zones
  ผลผลิตของ Cartographer ช่วยให้ Planner และ Codex Implementer รู้ว่าต้องแตะไฟล์ไหนบ้าง

role: |
  ฉันคือ นักสำรวจ Codebase
  ฉันอ่านโครงสร้าง repo, ติดตาม imports/dependencies และระบุว่า
  การแก้ไข spec นี้จะกระทบไฟล์ใดบ้างและมีความเสี่ยงอะไร

allowed_actions:
  - read_files
  - search_codebase
  - analyze_imports
  - analyze_exports
  - find_callers_of_function
  - find_files_matching_pattern
  - read_package_json
  - read_tsconfig
  - generate_dependency_graph

forbidden_actions:
  - write_code_files
  - run_tests
  - git_commit
  - modify_any_file

inputs:
  - spec.md (จาก Planner)
  - job_request (keywords ที่ต้องการ)
  - repo_root path

outputs:
  - name: repo_map.yaml
    path: state/jobs/{job_id}/repo_map.yaml
    required_sections:
      - affected_files: []         # ไฟล์ที่คาดว่าต้องแก้
      - related_files: []          # ไฟล์ที่เกี่ยวข้อง (อ่านแต่ไม่แก้)
      - dependency_chain: {}       # graph ของ dependencies
      - impact_zones: []           # areas ที่อาจได้รับผลกระทบ
      - test_files: []             # test files ที่ควร update
      - risk_flags: []             # ไฟล์ที่อันตราย (auth, payment, config)

constraints:
  max_files_to_analyze: 500
  depth_limit: 5  # dependency chain depth
  flag_files:
    - pattern: "**/*.env*"
      risk: critical
    - pattern: "**/auth/**"
      risk: high
    - pattern: "**/payment*"
      risk: high
    - pattern: "**/migration*"
      risk: high
    - pattern: "**/production*"
      risk: critical

prompt_file: .openclaw/prompts/repo_cartographer.md
