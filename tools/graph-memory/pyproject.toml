[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "sirinx-graph-memory"
version = "0.1.0"
description = "Provider-free, proposal-only shared graph memory tooling for SIRINX"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "graphifyy[mcp]==0.9.25",
  "langchain==1.3.14",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "mcp==1.28.1",
  "pydantic==2.13.4",
]

[project.scripts]
sirinx-graph-memory = "sirinx_graph_memory.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sirinx_graph_memory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = true
